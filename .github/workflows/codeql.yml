name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

jobs:
  analyse:
    name: Analyse Python
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: Analyse
        uses: github/codeql-action/analyze@v4
